<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>JobTracker</h1>

    <div class="layout">
      <section>
        <h2 id="form-heading">Add a job application</h2>
        <form id="application-form" novalidate>
          <label for="company">Company name</label>
          <input type="text" id="company" name="company">

          <label for="position">Position</label>
          <input type="text" id="position" name="position">

          <label for="date-applied">Date applied</label>
          <input type="date" id="date-applied" name="dateApplied">

          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="">Select a status</option>
            <option value="Applied">Applied</option>
            <option value="Interviewing">Interviewing</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>

          <p id="form-error" class="error" role="alert"></p>

          <button type="submit" id="submit-button">Add application</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancel edit</button>
        </form>
      </section>

      <section>
        <h2>Saved applications</h2>

        <div class="filters">
          <div>
            <label for="search">Search</label>
            <input type="search" id="search" placeholder="Company or position">
          </div>
          <div>
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="">All statuses</option>
              <option value="Applied">Applied</option>
              <option value="Interviewing">Interviewing</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>
          <div>
            <label for="sort-by">Sort by</label>
            <select id="sort-by">
              <option value="newest" selected>Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="company">Company A–Z</option>
            </select>
          </div>
        </div>

        <p id="result-count" aria-live="polite"></p>
        <p id="empty-message">No applications yet.</p>
        <p id="no-matches-message" hidden>No applications match your search and filter.</p>
        <ul id="application-list"></ul>
      </section>
    </div>
  </main>
  <script src="applications.js"></script>
  <script src="storage.js"></script>
  <script src="filters.js"></script>
  <script src="sorting.js"></script>
  <script src="app.js"></script>
</body>
</html>
